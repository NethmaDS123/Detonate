[project]
name = "detonate-worker"
version = "0.1.0"
description = "Detonate background jobs (daily board, outbox, rebuilds)"
requires-python = ">=3.12"
dependencies = [
  "detonate-engine",
  "redis>=5.2",
]

[project.scripts]
detonate-worker = "detonate_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv.sources]
detonate-engine = { workspace = true }

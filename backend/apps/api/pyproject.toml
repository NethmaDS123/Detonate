[project]
name = "detonate-api"
version = "0.1.0"
description = "Detonate HTTP API"
requires-python = ">=3.12"
dependencies = [
  "detonate-engine",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "redis>=5.2",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv.sources]
detonate-engine = { workspace = true }

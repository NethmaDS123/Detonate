services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://detonate:detonate@postgres:5432/detonate
      REDIS_URL: redis://redis:6379/0
      API_CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_UTC_HOUR: "0"
      WORKER_UTC_MINUTE: "5"
    command:
      [
        "uv",
        "run",
        "--package",
        "detonate-worker",
        "detonate-worker",
        "schedule",
      ]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - worker

[project]
name = "detonate-backend"
version = "0.1.0"
description = "Detonate API and canonical game engine. Don't."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/engine"]

[tool.uv.sources]
detonate-engine = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/engine/tests"]
pythonpath = ["packages/engine/src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api/src", "apps/worker/src", "packages/engine/src"]
